services:
  postgres:
    image: postgres:17-alpine
    container_name: numberone-db
    environment:
      POSTGRES_DB: numberone
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d numberone"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: numberone-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: numberone-app
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/numberone
      DB_USERNAME: admin
      DB_PASSWORD: admin
      AUTHENTICATED_USER_PROVIDER: local
      LOCAL_AUTHENTICATED_SUBJECT: local-admin
      LOCAL_AUTHENTICATED_STATUS: ACTIVE
      LOCAL_AUTHENTICATED_ROLES: ADMIN
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_MAIL_FROM: no-reply@numberone.local
      SERVICE_ORDER_APPROVAL_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
