name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Required validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run automated tests
        run: ./mvnw --batch-mode clean verify

      - name: Build container image
        run: docker build --tag numberone-auto-service-api:${{ github.sha }} .

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Validate Kubernetes overlays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered-manifests
          for environment in homolog production; do
            kubectl kustomize "k8s/overlays/${environment}" \
              > "rendered-manifests/${environment}.yaml"
          done

          docker run --rm \
            --volume "$PWD:/workspace" \
            ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict \
            -summary \
            -kubernetes-version 1.36.0 \
            /workspace/rendered-manifests

          if grep -R -E 'JWT_SECRET|BOOTSTRAP_ADMIN_(USERNAME|PASSWORD)' k8s; then
            echo "::error::Obsolete application-managed authentication secret found."
            exit 1
          fi

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site
          if-no-files-found: warn
