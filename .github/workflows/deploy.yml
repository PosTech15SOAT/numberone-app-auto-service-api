name: Deploy API

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}

    env:
      DEPLOYMENT_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
      K8S_NAMESPACE: ${{ github.ref_name == 'main' && 'numberone-production' || 'numberone-homolog' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'numberone-auto-service-api' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      DB_IDENTIFIER: ${{ vars.DB_IDENTIFIER || 'numberone-lab-postgres' }}
      DB_PORT: ${{ vars.DB_PORT || '5432' }}
      DB_NAME: ${{ vars.DB_NAME || 'numberone' }}
      DB_SSL_MODE: ${{ vars.DB_SSL_MODE || 'require' }}
      MAIL_HOST: ${{ vars.MAIL_HOST }}
      MAIL_PORT: ${{ vars.MAIL_PORT || '587' }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_SMTP_AUTH: ${{ vars.MAIL_SMTP_AUTH || 'true' }}
      MAIL_SMTP_STARTTLS: ${{ vars.MAIL_SMTP_STARTTLS || 'true' }}
      APP_MAIL_FROM: ${{ vars.APP_MAIL_FROM }}
      SERVICE_ORDER_APPROVAL_BASE_URL: ${{ vars.SERVICE_ORDER_APPROVAL_BASE_URL || 'http://numberone-api-service' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCOUNT_ID EKS_CLUSTER_NAME DB_IDENTIFIER MAIL_HOST APP_MAIL_FROM; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in the selected GitHub environment."
              exit 1
            fi
          done

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run automated tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Load RDS connection from AWS
        shell: bash
        run: |
          set -euo pipefail

          DB_INSTANCE_JSON="$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_IDENTIFIER" \
            --region "$AWS_REGION" \
            --output json)"

          DB_STATUS="$(jq -r '.DBInstances[0].DBInstanceStatus // empty' <<< "$DB_INSTANCE_JSON")"
          DB_HOST_VALUE="$(jq -r '.DBInstances[0].Endpoint.Address // empty' <<< "$DB_INSTANCE_JSON")"
          DB_SECRET_ARN="$(jq -r '.DBInstances[0].MasterUserSecret.SecretArn // empty' <<< "$DB_INSTANCE_JSON")"

          if [[ "$DB_STATUS" != "available" || -z "$DB_HOST_VALUE" || -z "$DB_SECRET_ARN" ]]; then
            echo "::error::RDS instance $DB_IDENTIFIER is not ready or has no managed master secret. Status: ${DB_STATUS:-unknown}."
            exit 1
          fi

          DB_SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id "$DB_SECRET_ARN" \
            --region "$AWS_REGION" \
            --query SecretString \
            --output text)"

          DB_USERNAME_VALUE="$(jq -r '.username // empty' <<< "$DB_SECRET_JSON")"
          DB_PASSWORD_VALUE="$(jq -r '.password // empty' <<< "$DB_SECRET_JSON")"

          if [[ -z "$DB_USERNAME_VALUE" || -z "$DB_PASSWORD_VALUE" ]]; then
            echo "::error::The RDS managed secret does not contain username and password."
            exit 1
          fi

          echo "::add-mask::$DB_USERNAME_VALUE"
          echo "::add-mask::$DB_PASSWORD_VALUE"
          echo "DB_HOST=$DB_HOST_VALUE" >> "$GITHUB_ENV"
          echo "DB_USERNAME=$DB_USERNAME_VALUE" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$DB_PASSWORD_VALUE" >> "$GITHUB_ENV"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"
          kubectl cluster-info

      - name: Create namespace and runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f "k8s/overlays/${DEPLOYMENT_ENVIRONMENT}/namespace.yaml"

          kubectl create configmap numberone-api-runtime-config \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=MAIL_HOST="$MAIL_HOST" \
            --from-literal=MAIL_PORT="$MAIL_PORT" \
            --from-literal=MAIL_SMTP_AUTH="$MAIL_SMTP_AUTH" \
            --from-literal=MAIL_SMTP_STARTTLS="$MAIL_SMTP_STARTTLS" \
            --from-literal=APP_MAIL_FROM="$APP_MAIL_FROM" \
            --from-literal=SERVICE_ORDER_APPROVAL_BASE_URL="$SERVICE_ORDER_APPROVAL_BASE_URL" \
            --dry-run=client -o yaml \
            | kubectl apply -f -

          kubectl create secret generic numberone-api-secret \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=DB_URL="jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}" \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=MAIL_USERNAME="$MAIL_USERNAME" \
            --from-literal=MAIL_PASSWORD="$MAIL_PASSWORD" \
            --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Apply Kubernetes manifests
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          RENDERED_MANIFEST="$RUNNER_TEMP/numberone-api.yaml"
          kubectl kustomize "k8s/overlays/${DEPLOYMENT_ENVIRONMENT}" \
            | sed "s|image.invalid/numberone-auto-service-api:placeholder|${IMAGE_URI}|g" \
            > "$RENDERED_MANIFEST"

          if grep -q 'image.invalid/numberone-auto-service-api:placeholder' "$RENDERED_MANIFEST"; then
            echo "::error::Container image placeholder was not replaced."
            exit 1
          fi

          kubectl apply -f "$RENDERED_MANIFEST"
          kubectl rollout status deployment/numberone-api \
            --namespace "$K8S_NAMESPACE" \
            --timeout=10m

      - name: Wait for internal load balancer
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            LOAD_BALANCER_HOSTNAME="$(kubectl get service numberone-api-service \
              --namespace "$K8S_NAMESPACE" \
              --output jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            if [[ -n "$LOAD_BALANCER_HOSTNAME" ]]; then
              echo "LOAD_BALANCER_HOSTNAME=$LOAD_BALANCER_HOSTNAME" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done

          kubectl describe service numberone-api-service --namespace "$K8S_NAMESPACE"
          echo "::error::The internal load balancer was not provisioned within 10 minutes."
          exit 1

      - name: Smoke test health endpoint
        shell: bash
        run: |
          set -euo pipefail
          kubectl port-forward \
            --namespace "$K8S_NAMESPACE" \
            service/numberone-api-service 18080:80 \
            > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          PORT_FORWARD_PID=$!
          trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/api/public/health; then
              exit 0
            fi
            sleep 2
          done

          cat "$RUNNER_TEMP/port-forward.log"
          exit 1

      - name: Warn when Metrics Server is unavailable
        continue-on-error: true
        run: |
          kubectl get --raw /apis/metrics.k8s.io/v1beta1/nodes >/dev/null \
            || echo "::warning::Metrics Server is not available; HPA metrics will remain unknown."

      - name: Publish deployment summary
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          kubectl get deployment,service,hpa,poddisruptionbudget \
            --namespace "$K8S_NAMESPACE"
          {
            echo "### API deployment"
            echo "- Environment: $DEPLOYMENT_ENVIRONMENT"
            echo "- Namespace: $K8S_NAMESPACE"
            echo "- Image: \`$IMAGE_URI\`"
            echo "- Cluster: $EKS_CLUSTER_NAME"
            echo "- Internal load balancer: \`$LOAD_BALANCER_HOSTNAME\`"
            echo "- Next: run the auth Terraform deployment to create/update the API Gateway VPC Link."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect rollout diagnostics
        if: failure()
        run: |
          kubectl get pods --namespace "$K8S_NAMESPACE" -o wide || true
          kubectl describe deployment/numberone-api --namespace "$K8S_NAMESPACE" || true
          kubectl logs deployment/numberone-api --namespace "$K8S_NAMESPACE" --tail=200 || true
