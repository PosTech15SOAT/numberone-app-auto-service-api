  - name: 00 - Preparação Reexecutável
    meta:
      id: fld_0fef5e56d41c4d558b22b6253aae8435
      created: 1788738292694
      modified: 1789245038000
      sortKey: -1788755781665
      description: ""
    children:
      - url: "{{ _.base_url }}/api/admin/clientes"
        name: 01 - Criar Cliente
        meta:
          id: req_f0a995cc7d4f473594ba9e6edb93fb89
          created: 1788738341305
          modified: 1788738857023
          isPrivate: false
          description: Cria um cliente ativo para abertura posterior de veiculos e ordens
            de servico.
          sortKey: -1788738350490
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "nome": "Cliente Runner {{ _.run_suffix }}",
              "tipoDocumento": "PESSOA_FISICA",
              "documento": "{{ _.run_cpf }}",
              "email": "runner.{{ _.run_suffix }}@numberone.local",
              "telefone": "1113456789",
              "endereco": "rua rua",
              "ativo": true
            }
        headers:
          - name: X-Correlation-Id
            value: "{{ _.correlation_id }}"
            disabled: false
          - name: Content-Type
            value: application/json
            disabled: false
        authentication:
          type: bearer
          disabled: false
          token: "{{ _.accessToken }}"
        scripts:
          preRequest: >-
            function randomDigits(n) {
              let s = "";
              for (let i = 0; i < n; i++) s += Math.floor(Math.random() * 10);
              return s;
            }


            function generateCpf() {
              let base = randomDigits(9);

              function digit(value, factor) {
                let total = 0;
                for (let i = 0; i < value.length; i++) {
                  total += Number(value[i]) * (factor - i);
                }
                const remainder = (total * 10) % 11;
                return remainder === 10 ? 0 : remainder;
              }

              const d1 = digit(base, 10);
              const d2 = digit(base + d1, 11);
              return base + d1 + d2;
            }


            function letters(n) {
              const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
              let out = "";
              for (let i = 0; i < n; i++) {
                out += alphabet[Math.floor(Math.random() * alphabet.length)];
              }
              return out;
            }


            const suffix = Date.now().toString().slice(-8) +
            Math.floor(Math.random() * 1000);

            const cpf = generateCpf();

            const plate = letters(3) + Math.floor(Math.random() * 10) +
            letters(1) + randomDigits(2);


            insomnia.environment.set("run_suffix", suffix);

            insomnia.environment.set("run_cpf", cpf);

            insomnia.environment.set("run_plate", plate);


            insomnia.environment.set("run_service_oil_code", "OLEO-" + suffix);

            insomnia.environment.set("run_service_brake_code", "FREIO-" +
            suffix);

            insomnia.environment.set("run_service_diagnostic_code", "DIAG-" +
            suffix);


            insomnia.environment.set("run_inventory_filter_code", "FILTRO-" +
            suffix);

            insomnia.environment.set("run_inventory_oil_code", "OLEO5W30-" +
            suffix);

            insomnia.environment.set("run_inventory_brake_code", "PASTILHA-" +
            suffix);


            // Limpa IDs do fluxo anterior para evitar replay acidental.

            insomnia.environment.set("service_order_id", "");

            insomnia.environment.set("service_order_item_id", "");

            insomnia.environment.set("budget_id", "");
          afterResponse: |
            const body = insomnia.response.json();

            insomnia.test("01 - Criar Cliente deve retornar 201 e id", () => {
              insomnia.expect(insomnia.response.code).to.equal(201);
              insomnia.expect(body?.id).to.exist;
            });

            insomnia.environment.set("customer_id", body.id);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
