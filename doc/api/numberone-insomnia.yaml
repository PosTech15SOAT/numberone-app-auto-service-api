spec:
  contents:
    openapi: 3.1.0
    info:
      title: NumberOne - API da Oficina
      description: >
        API REST do Tech Challenge Fase 3 para gestao de oficina mecanica.


        Em producao, a autenticacao e validada pelo API Gateway/Authorizer. A
        API recebe somente

        o contexto de identidade confiavel e aplica autorizacao por papel,
        permissao e propriedade.

        O sistema cobre cadastro de clientes e veiculos,

        catalogo de servicos automotivos, estoque de pecas e insumos, ordem de
        servico,

        orcamento, aprovacao e acompanhamento autenticado da OS.


        No profile local, uma identidade ADMIN controlada por configuracao e
        usada apenas para desenvolvimento.
      version: v1
    servers:
      - url: http://localhost:8080
        description: Ambiente local com Docker Compose ou Maven
    tags:
      - name: Health
        description: Verificacao publica de disponibilidade da API.
      - name: Autenticacao e Sessao
        description: Login administrativo com JWT e consulta da sessao autenticada.
      - name: Clientes
        description: Cadastro de clientes da oficina, incluindo tipo de documento,
          contato e endereco.
      - name: Veiculos
        description: Cadastro de veiculos vinculados aos clientes.
      - name: Servicos Automotivos
        description: Catalogo de servicos executados pela oficina, com valor base e
          tempo estimado.
      - name: Estoque - Itens
        description: Cadastro de pecas, insumos, lubrificantes e acessorios.
      - name: Estoque - Movimentacoes
        description: Entradas, baixas, ajustes e historico de movimentacao do estoque.
      - name: Ordens de Servico
        description: "Fluxo principal da oficina: abertura, diagnostico, execucao,
          conclusao e entrega."
      - name: Itens da Ordem de Servico
        description: Servicos executados dentro de uma ordem de servico.
      - name: Insumos da Ordem de Servico
        description: Pecas e insumos consumidos por um item de servico da OS.
      - name: Orcamentos
        description: Geracao, aprovacao, rejeicao e links publicos de orcamento.
      - name: Acompanhamento Publico
        description: Consulta publica do andamento da ordem de servico pelo cliente.
    paths:
      /api/admin/veiculos/{id}:
        get:
          tags:
            - Veiculos
          summary: Buscar veiculo por ID
          description: Consulta um veiculo pelo identificador UUID.
          operationId: findById
          parameters:
            - name: id
              in: path
              description: Identificador UUID do recurso.
              required: true
              schema:
                type: string
                format: uuid
              example: 54e94616-70ad-4ce7-b6f7-41c6747d802e
          responses:
            "200":
              description: Veiculo encontrado.
              content:
                "*/*":
                  schema:
                    $ref: "#/components/schemas/VehicleResponse"
                application/json:
                  examples:
                    veiculo:
                      summary: Veiculo encontrado
                      value:
                        id: 74a3eaac-979c-4f93-a926-2a3595047db9
                        placa: ABC1D23
                        marca: Toyota
                        modelo: Corolla
                        ano: 2022
                        idCliente: 1ed09259-0f4f-4fd8-867c-a13d4d2fda4e
                        criadoEm: 2026-04-28 09:15:00
                        atualizadoEm: 2026-04-28 09:15:00
            "400":
              description: Requisicao invalida ou erro de validacao.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
                  examples:
                    erro-400:
                      summary: Requisicao invalida ou erro de validacao.
                      value:
                        status: 400
                        message: Erro de validacao
                        errors:
                          - "nome: Nome e obrigatorio"
            "401":
              description: Token JWT ausente, invalido ou expirado.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
                  examples:
                    erro-401:
                      summary: Token JWT ausente, invalido ou expirado.
                      value:
                        status: 401
                        message: Token JWT ausente, invalido ou expirado
            "404":
              description: Recurso nao encontrado.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
                  examples:
                    erro-404:
                      summary: Recurso nao encontrado.
                      value:
                        status: 404
                        message: Recurso nao encontrado
            "500":
              description: Erro interno inesperado.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
                  examples:
