# Compose exclusivo para analise local de qualidade e seguranca com SonarQube.
# Este arquivo nao faz parte do runtime da aplicacao NumberOne e nao deve ser
# misturado ao docker-compose principal do projeto.

services:
  sonarqube:
    image: sonarqube:community
    container_name: numberone-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
    name: numberone_sonarqube_data
  sonarqube_extensions:
    name: numberone_sonarqube_extensions
  sonarqube_logs:
    name: numberone_sonarqube_logs
