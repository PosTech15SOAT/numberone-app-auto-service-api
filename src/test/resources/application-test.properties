spring.datasource.url=jdbc:h2:mem:numberone;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

app.security.jwt.issuer=numberone-api-test
app.security.jwt.secret=test-jwt-secret-with-at-least-32-chars
app.security.jwt.access-token-expiration=30m
app.security.bootstrap-admin.username=admin
app.security.bootstrap-admin.password=admin123456
app.security.bootstrap-admin.role=ADMIN

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=no-reply@numberone.local

app.service-order.approval.base-url=http://localhost:8080
