spring.application.name=numberone

# database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/numberone}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Security
app.security.identity.provider=${AUTHENTICATED_USER_PROVIDER:local}
app.security.identity.local.subject=${LOCAL_AUTHENTICATED_SUBJECT:local-admin}
app.security.identity.local.customer-id=${LOCAL_AUTHENTICATED_CUSTOMER_ID:00000000-0000-0000-0000-000000000001}
app.security.identity.local.status=${LOCAL_AUTHENTICATED_STATUS:ACTIVE}
app.security.identity.local.roles=${LOCAL_AUTHENTICATED_ROLES:ADMIN}
app.security.identity.local.permissions=${LOCAL_AUTHENTICATED_PERMISSIONS:}
app.security.identity.headers.correlation-id=${CORRELATION_ID_HEADER:X-Correlation-Id}

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${APP_MAIL_FROM:no-reply@numberone.local}

# Service order approval
app.service-order.approval.base-url=${SERVICE_ORDER_APPROVAL_BASE_URL:http://localhost:8080}
