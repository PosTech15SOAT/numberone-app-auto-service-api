spring.application.name=numberone

# database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Security
app.security.jwt.issuer=${JWT_ISSUER:numberone-api}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1h}
app.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
app.security.bootstrap-admin.role=${BOOTSTRAP_ADMIN_ROLE:ADMIN}

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}
app.mail.from=${APP_MAIL_FROM}

# Service order approval
app.service-order.approval.base-url=${SERVICE_ORDER_APPROVAL_BASE_URL}
